<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试题库</title>
   <link rel="stylesheet" href="./css/ms.css">
</head>
<body>

<div id="container"></div>
<script src="./js/App自动化测试.js"></script>
<script src="./js/HR面试题.js"></script>
<script src="./js/linux服务器.js"></script>
<script src="./js/python基础.js"></script>
<script src="./js/web自动化测试.js"></script>
<script src="./js/性能测试面试题.js"></script>
<script src="./js/接口测试工具.js"></script>
<script src="./js/接口自动化测试.js"></script>
<script src="./js/数据库面试题.js"></script>
<script src="./js/软件测试基础.js"></script>
<script>

const alldata = {
    "软件测试基础":软件测试基础,
    "App自动化测试":App自动化测试,
    "HR面试题":HR面试题,
    "linux服务器":linux服务器,
    "web自动化测试":web自动化测试,
    "性能测试面试题":性能测试面试题,
    "接口测试工具":接口测试工具,
    "接口自动化测试":接口自动化测试,
    "数据库面试题":数据库面试题,
    "python基础":python基础
}

// 当前打开分类
let currentOpenCate = null;
// 记录当前展开的题目元素
let currentOpenQues = null;

// 渲染
function renderPage() {
    const container = document.getElementById('container');
    let html = '';
    for (let title in alldata) {
        const data = alldata[title];
        const total = data.body.length;
        html += `
        <div class="category">
            <div class="category-header" onclick="switchCate('${title}')">
                <span class="category-icon">${data.icon}</span>
                <div class="category-title">${title}</div>
                <div class="category-count">${total}题</div>
                <div class="category-arrow" id="arrow_${title}">∨</div>
            </div>
            <div class="question-list" id="list_${title}">
        `;
        data.body.forEach(item => {
            html += `
            <div class="question-item">
                <div class="question" onclick="toggleAns(this)">
                    ${item.subject}
                    <span class="question-arrow">></span>
                </div>
                <div class="answer">${item.answer}</div>
            </div>
            `;
        });
        html += `</div></div>`;
    }
    container.innerHTML = html;
}

// 分类互斥：只开一个
function switchCate(title) {
    // 关闭所有分类
    for(let t in alldata){
        document.getElementById(`list_${t}`).style.display = 'none';
        document.getElementById(`arrow_${t}`).innerText = '∨';
    }
    // 关闭所有题目答案
    closeAllAnswer();
    currentOpenQues = null;

    if(currentOpenCate === title){
        currentOpenCate = null;
        return;
    }
    document.getElementById(`list_${title}`).style.display = 'block';
    document.getElementById(`arrow_${title}`).innerText = '∧';
    currentOpenCate = title;
}

// 关闭所有题目答案
function closeAllAnswer(){
    document.querySelectorAll('.answer').forEach(ans=>{
        ans.style.display = 'none';
    });
    document.querySelectorAll('.question-arrow').forEach(arr=>{
        arr.style.transform = 'rotate(0deg)';
    });
}

// 题目：支持互斥 + 点击同一条收起
function toggleAns(el) {
    const ans = el.nextElementSibling;
    const arrow = el.querySelector('.question-arrow');

    // 如果点的是当前已经展开的题目 → 手动收缩
    if(currentOpenQues === el){
        ans.style.display = 'none';
        arrow.style.transform = 'rotate(0deg)';
        currentOpenQues = null;
        return;
    }

    // 先关闭所有
    closeAllAnswer();
    // 展开当前
    ans.style.display = 'block';
    arrow.style.transform = 'rotate(90deg)';
    currentOpenQues = el;
}

window.onload = renderPage;
</script>

</body>
</html>
