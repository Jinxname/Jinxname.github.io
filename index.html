<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QA Tool</title>


    <!-- ========================================================
         Bootstrap
         ======================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ========================================================
         公共 CSS
         ======================================================== -->

    <link
        rel="stylesheet"
        href="css/common.css"
    >


    <!-- ========================================================
         工具 CSS
         ======================================================== -->

    <link
        rel="stylesheet"
        href="css/tools/text_tool.css"
    >

    <link
        rel="stylesheet"
        href="css/tools/timestamp.css"
    >

    <link
        rel="stylesheet"
        href="css/tools/curl_batch.css"
    >

    <link
        rel="stylesheet"
        href="css/tools/header_tool.css"
    >

    <link
        rel="stylesheet"
        href="css/tools/json_sum.css"
    >

</head>


<body>

<div class="app-container">


    <!-- ========================================================
         左侧菜单
         ======================================================== -->

    <aside class="sidebar">

        <!-- Logo -->

        <div class="sidebar-logo">

            <div class="sidebar-logo-icon">
                QA
            </div>

            <div class="sidebar-logo-text">
                QA Tool
            </div>

        </div>


        <!-- 菜单 -->

        <div class="sidebar-menu">


            <!-- 首页 -->

            <div
                class="menu-item active"
                data-page="home"
            >

                <span class="menu-icon">
                    🏠
                </span>

                <span class="menu-text">
                    首页
                </span>

            </div>


            <!-- 文本处理 -->

            <div
                class="menu-item"
                data-page="text-tool"
            >

                <span class="menu-icon">
                    📝
                </span>

                <span class="menu-text">
                    文本处理
                </span>

            </div>


            <!-- 时间戳 -->

            <div
                class="menu-item"
                data-page="timestamp"
            >

                <span class="menu-icon">
                    ⏱️
                </span>

                <span class="menu-text">
                    时间戳转换
                </span>

            </div>


            <!-- 接口批量请求 -->

            <div
                class="menu-item"
                data-page="curl-batch"
            >

                <span class="menu-icon">
                    🔗
                </span>

                <span class="menu-text">
                    接口批量请求
                </span>

            </div>


            <!-- Header -->

            <div
                class="menu-item"
                data-page="header-tool"
            >

                <span class="menu-icon">
                    📋
                </span>

                <span class="menu-text">
                    Header 转 JSON
                </span>

            </div>


            <!-- JSON -->

            <div
                class="menu-item"
                data-page="json-sum"
            >

                <span class="menu-icon">
                    🔢
                </span>

                <span class="menu-text">
                    JSON 字段统计
                </span>

            </div>


        </div>

    </aside>


    <!-- ========================================================
         主区域
         ======================================================== -->

    <main class="main-container">


        <!-- ====================================================
             顶部
             ==================================================== -->

        <header class="topbar">

            <div class="topbar-title">
                首页
            </div>

        </header>


        <!-- ====================================================
             页面内容
             ==================================================== -->

        <div class="content-container">


            <!-- ==================================================
                 首页
                 ================================================== -->

            <section
                id="page-home"
                class="page"
            >

                <div class="home-page">

                    <div class="home-header">

                        <h1>
                            QA Tool
                        </h1>

                        <p>
                            常用测试工具集合
                        </p>

                    </div>


                    <div class="tool-grid">


                        <!-- 文本处理 -->

                        <div
                            class="tool-card"
                            data-page="text-tool"
                        >

                            <div class="tool-card-icon">
                                📝
                            </div>

                            <div class="tool-card-content">

                                <h3>
                                    文本处理
                                </h3>

                                <p>
                                    文本去重、去空行、排序及空格处理
                                </p>

                            </div>

                        </div>


                        <!-- 时间戳 -->

                        <div
                            class="tool-card"
                            data-page="timestamp"
                        >

                            <div class="tool-card-icon">
                                ⏱️
                            </div>

                            <div class="tool-card-content">

                                <h3>
                                    时间戳转换
                                </h3>

                                <p>
                                    时间戳与日期时间快速转换
                                </p>

                            </div>

                        </div>


                        <!-- Curl -->

                        <div
                            class="tool-card"
                            data-page="curl-batch"
                        >

                            <div class="tool-card-icon">
                                🔗
                            </div>

                            <div class="tool-card-content">

                                <h3>
                                    接口批量请求
                                </h3>

                                <p>
                                    Curl 解析及接口批量请求
                                </p>

                            </div>

                        </div>


                        <!-- Header -->

                        <div
                            class="tool-card"
                            data-page="header-tool"
                        >

                            <div class="tool-card-icon">
                                📋
                            </div>

                            <div class="tool-card-content">

                                <h3>
                                    Header 转 JSON
                                </h3>

                                <p>
                                    Header 文本快速转换为 JSON
                                </p>

                            </div>

                        </div>


                        <!-- JSON -->

                        <div
                            class="tool-card"
                            data-page="json-sum"
                        >

                            <div class="tool-card-icon">
                                🔢
                            </div>

                            <div class="tool-card-content">

                                <h3>
                                    JSON 字段统计
                                </h3>

                                <p>
                                    JSON 数字字段快速统计
                                </p>

                            </div>

                        </div>


                    </div>

                </div>

            </section>


            <!-- ==================================================
                 文本处理
                 ================================================== -->

            <section
                id="page-text-tool"
                class="page hidden"
            ></section>


            <!-- ==================================================
                 时间戳
                 ================================================== -->

            <section
                id="page-timestamp"
                class="page hidden"
            ></section>


            <!-- ==================================================
                 接口批量请求
                 ================================================== -->

            <section
                id="page-curl-batch"
                class="page hidden"
            ></section>


            <!-- ==================================================
                 Header
                 ================================================== -->

            <section
                id="page-header-tool"
                class="page hidden"
            ></section>


            <!-- ==================================================
                 JSON 字段统计
                 ================================================== -->

            <section
                id="page-json-sum"
                class="page hidden"
            ></section>


        </div>

    </main>

</div>


<!-- ============================================================
     Bootstrap JS
     ============================================================ -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ============================================================
     公共 JS
     ============================================================ -->

<script src="js/common.js"></script>


<!-- ============================================================
     工具 JS
     ============================================================ -->

<script src="js/tools/text_tool.js"></script>

<script src="js/tools/timestamp.js"></script>

<script src="js/tools/curl_batch.js"></script>

<script src="js/tools/header_tool.js"></script>

<script src="js/tools/json_sum.js"></script>


</body>

</html>
